[project]
name = "specgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "neo4j>=5.24", "pydantic>=2.8",
  "httpx>=0.27", "rapidfuzz>=3.9", "datasketch>=1.6", "sentence-transformers[onnx]>=3.0"
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
